<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iris</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app">
      <header class="app-header">
        <h1>Iris</h1>
      </header>

      <main class="app-body">
        <section class="panel" id="connections-panel">
          <h2>Connections</h2>

          <form id="connect-form" class="add-connection-form">
            <input id="name-input" placeholder="Connection name" value="Test client" required />
            <input id="endpoint-input" placeholder="http://127.0.0.1:9225" value="http://127.0.0.1:9225" required />
            <input id="token-input" placeholder="Auth token (optional)" type="password" />
            <button type="submit">Add connection</button>
          </form>

          <ul id="connections-list" class="connections-list"></ul>
        </section>

        <section class="panel" id="control-panel" style="display: none">
          <div class="row">
            <h2>Control: <span id="control-session-id"></span></h2>
            <button id="release-control-btn" type="button">Release control</button>
          </div>
          <canvas id="screencast" width="1024" height="640"></canvas>
          <p id="latency" class="muted"></p>
        </section>
      </main>
    </div>
  </body>
</html>
