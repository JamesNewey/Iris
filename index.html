<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iris</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>Iris — Phase 2 walking skeleton</h1>

      <form class="row" id="connect-form">
        <input id="name-input" placeholder="Connection name" value="Test client" />
        <input id="endpoint-input" placeholder="http://127.0.0.1:9225" value="http://127.0.0.1:9225" />
        <button type="submit">Connect</button>
      </form>

      <p id="status"></p>

      <div id="sessions"></div>

      <div id="control" style="display: none">
        <h2>Control: <span id="control-session-id"></span></h2>
        <canvas id="screencast" width="1024" height="640" style="border: 1px solid #888; cursor: crosshair"></canvas>
        <p id="latency"></p>
      </div>
    </main>
  </body>
</html>
